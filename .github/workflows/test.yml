# Checks that need no model and no key (tests/), on every push to rules-standalone: seconds, free.
name: Test
on:
  push:
    branches: [rules-standalone]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund && npm test
